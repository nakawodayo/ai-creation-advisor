<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創作相談AI</title>
    <link rel="stylesheet" href="./src/assets/styles/style.css">
    <script type="module" src="./src/scripts/main.ts" defer></script>
</head>
<body>

    <div id="top-screen">
        <button id="start-button">クリエーションの悩みを相談する</button>
        <button id="settings-button">プロンプト設定</button>
    </div>

    <div id="settings-screen" style="display: none;">
        <h2>プロンプト設定</h2>
        <textarea id="prompt-input">
あなたは、創作に関する悩みを解決するAIアドバイザーです。
提供されたフローチャートを基にユーザーの悩みを分析し、適切な質問を行いながら最適な回答を導いてください。
        </textarea>
        <button id="save-prompt-button">保存</button>
        <button id="back-button">トップへ戻る</button>
    </div>

    <div id="dialogue-screen" style="display: none;">
        <div id="ai-message">AIの質問がここに表示されます</div>
        <div id="options">
            <button class="option">1</button>
            <button class="option">2</button>
            <button class="option">3</button>
            <button class="option">4</button>
        </div>
        <input type="text" id="user-input" placeholder="自由入力（必要に応じて入力してください）">
        <button id="submit-button">送信</button>
        <button id="home-button">初めからやり直す</button>
    </div>
    

</body>
</html>
