<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Decision Flowchart</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <div id="question"></div>
    <div class="button-group hidden" id="yesNoButtons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div class="textfield hidden" id="aiAssistantArea">
      <label for="aiInput">悩みや箇条書きを入力してください：</label>
      <textarea id="aiInput" rows="5" cols="40"></textarea>
      <button id="aiSubmit">送信</button>
    </div>
    <div class="reset-group hidden" id="resetContainer">
      <button id="resetBtn">最初からやり直す</button>
    </div>
  </div>
  <!-- main.jsを読み込む -->
  <script type="module" src="./src/scripts/main.ts"></script>
</body>
</html>
